[Settings]
; Game resolution. 0 = automatic (Windows desktop resolution).
; Resolution du jeu. 0 = automatique (resolution du bureau Windows).
Width=0
Height=0
; In automatic mode, screens taller than this are halved (4K -> 1080p: native 4K breaks the game).
; En automatique, si l'ecran depasse cette hauteur, la resolution est divisee par 2
; (une TV 4K 3840x2160 devient 1920x1080 : le jeu plante en 4K native).
MaxHeight=1440
; 1 = fix stretched HUD and menus (correct proportions). 0 = off.
; 1 = HUD et menus sans etirement. 0 = desactive.
FixHUD=1
; 1 = sound keeps playing when the game is in the background (Alt+Tab), no lost dialogue. 0 = off.
; 1 = le son continue quand le jeu est en arriere-plan (Alt+Tab), aucun dialogue perdu. 0 = desactive.
BackgroundAudio=1
